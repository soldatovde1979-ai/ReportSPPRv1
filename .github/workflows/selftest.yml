# selftest.yml v1.0 (05.10.2026) — стенд самопроверки на каждом коммите релиза (my-FT Т-73)
# ЧТО: при push и pull_request в main, если менялись файлы релиза, запускает examples/selftest_v5/run.py.
#      Код возврата 1 — красный крест у коммита. Токенов 0, ключи не нужны, около минуты.
# ПОЧЕМУ: «тест перед продом — каждый коммит релиза» (чат 05.10); правки только документов стенд не гоняют.
name: selftest

on:
  push:
    branches: [main]
    paths:
      - "src/report_v5.py"
      - "template_v5.html"
      - "RepSSPR_v*.ipynb"
      - "examples/selftest_v5/**"
      - "examples/build_mockup_v2.py"
      - "examples/make_demo_tab.py"
      - "examples/mockup_v2_ai.json"
      - "examples/mockup_report_v2.html"
      - "examples/sppr_dump_*_demo_tab.json"
      - ".github/workflows/selftest.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/report_v5.py"
      - "template_v5.html"
      - "RepSSPR_v*.ipynb"
      - "examples/selftest_v5/**"
      - "examples/build_mockup_v2.py"
      - "examples/make_demo_tab.py"
      - "examples/mockup_v2_ai.json"
      - "examples/mockup_report_v2.html"
      - "examples/sppr_dump_*_demo_tab.json"
      - ".github/workflows/selftest.yml"
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jinja2
      - run: python examples/selftest_v5/run.py
